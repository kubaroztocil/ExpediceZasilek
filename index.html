<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedice zásilek</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="w3-light-grey">
    <div class="w3-content w3-padding main-container">
        
        <header class="w3-container w3-center w3-padding-24 w3-blue-grey w3-round w3-card-2">
            <h1 class="w3-xxlarge"><b>Expedice zásilek</b></h1>
            <p class="w3-opacity">Logistický systém pro nakládku dopisů a balíků</p>
        </header>

        <div class="w3-row-padding w3-margin-top form-grid">
            
            <div class="w3-col m6 w3-margin-bottom">
                <div class="w3-card-4 w3-white w3-round">
                    <div class="w3-container w3-teal w3-padding-8 card-header">
                        <h3>Přidat dopis</h3>
                    </div>
                    <form id="dopisForm" class="w3-container w3-padding-16">
                        <label class="w3-text-teal" for="dopisNazev"><b>Název zásilky:</b></label>
                        <input id="dopisNazev" class="w3-input w3-border w3-round" type="text" placeholder="např. Smlouva" required>

                        <label class="w3-text-teal w3-margin-top block-label" for="dopisDruh"><b>Druh dopisu:</b></label>
                        <select id="dopisDruh" class="w3-select w3-border w3-round">
                            <option value="dopis">Standardní dopis</option>
                            <option value="doporuceny">Doporučený dopis</option>
                        </select>

                        <label class="w3-text-teal w3-margin-top block-label" for="dopisMnozstvi"><b>Množství (ks):</b></label>
                        <input id="dopisMnozstvi" class="w3-input w3-border w3-round" type="number" min="1" value="1" required>

                        <button id="submitDopis" class="w3-button w3-block w3-teal w3-section w3-ripple w3-round" type="button"><b>Naložit dopis</b></button>
                    </form>
                </div>
            </div>

            <div class="w3-col m6 w3-margin-bottom">
                <div class="w3-card-4 w3-white w3-round">
                    <div class="w3-container w3-indigo w3-padding-8 card-header">
                        <h3>Přidat balík</h3>
                    </div>
                    <form id="balikForm" class="w3-container w3-padding-16">
                        <label class="w3-text-indigo" for="balikNazev"><b>Název zásilky:</b></label>
                        <input id="balikNazev" class="w3-input w3-border w3-round" type="text" placeholder="např. Elektronika" required>

                        <div class="w3-row-padding compact-row">
                            <div class="w3-third">
                                <label class="w3-text-indigo w3-small" for="balikSirka">Šířka (cm):</label>
                                <input id="balikSirka" class="w3-input w3-border w3-round" type="number" min="1" required>
                            </div>
                            <div class="w3-third">
                                <label class="w3-text-indigo w3-small" for="balikVyska">Výška (cm):</label>
                                <input id="balikVyska" class="w3-input w3-border w3-round" type="number" min="1" required>
                            </div>
                            <div class="w3-third">
                                <label class="w3-text-indigo w3-small" for="balikHloubka">Hloubka (cm):</label>
                                <input id="balikHloubka" class="w3-input w3-border w3-round" type="number" min="1" required>
                            </div>
                        </div>

                        <label class="w3-text-indigo w3-margin-top block-label" for="balikVaha"><b>Váha (kg):</b></label>
                        <input id="balikVaha" class="w3-input w3-border w3-round" type="number" min="1" required>

                        <label class="w3-text-indigo w3-margin-top block-label" for="balikMnozstvi"><b>Množství (ks):</b></label>
                        <input id="balikMnozstvi" class="w3-input w3-border w3-round" type="number" min="1" value="1" required>

                        <p class="w3-margin-top">
                            <input id="balikKrehky" class="w3-check" type="checkbox">
                            <label for="balikKrehky" class="w3-validate"><b>Křehký balík (přirážka 30% k ceně)</b></label>
                        </p>

                        <button id="submitBalik" class="w3-button w3-block w3-indigo w3-section w3-ripple w3-round" type="button"><b>Naložit balík</b></button>
                    </form>
                </div>
            </div>

        </div>

        <div class="w3-card-4 w3-white w3-margin-top w3-round">
        <div class="w3-container w3-dark-grey w3-padding-8 card-header"> 
                <h3>Stav expedice a naložení dodávky</h3>
            </div>
            <div class="w3-container w3-padding-16">
                <div id="zprava-box" class="w3-panel w3-leftbar w3-border-blue w3-pale-blue w3-padding">
                    <p id="zprava" class="no-margin">Zatím nebyly provedeny žádné akce.</p>
                </div>
                
                <div id="vypis"></div>
            </div>
        </div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
